name: Close pull requests

# Shepherd Free is generated from a private source repository and published here automatically.
# Nobody commits to this repository by hand, so a pull request opened here can never be merged. It
# is closed at once, with a note saying where a change can be raised instead.
#
# pull_request_target runs with this repository's token so it can close a pull request from a fork.
# It never checks out or runs anything from the pull request.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    name: close (changes are made in the source repository)
    runs-on: ubuntu-latest
    steps:
      - name: Close with an explanation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$NUMBER" --comment "Thank you for this. Shepherd Free is generated from a private source repository and published here automatically, so this repository takes no changes directly and this pull request has been closed.

          To report a bug or suggest a change, please open an issue here instead. The maintainers read every issue; a fix is made in the source and arrives here with the next release."
