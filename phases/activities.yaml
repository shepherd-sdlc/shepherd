# What a person can do in each phase, beyond the documents it requires (spec 0023).
#
# This is the plugin's own declaration; SDLC Studio (the desktop app) draws it instead of keeping a second
# list of its own, so adding a command here needs no app change. It lives in a file of its own, not in
# phase-registry.yaml, because the registry and phase_model.py are protected core.
#
# Each activity:
#   id          unique within its phase
#   label       a plain sentence a project manager would recognise (this is what is shown)
#   command     the slash command this step belongs to (commands/<command>.md), or null
#   kind        run    — a script reads or writes something and reports the result
#               create — start documents from their templates, then fill them in the editor
#               check  — validate what has been written, advisory
#               draft  — one model-run step whose result a person keeps or discards
#               talk   — open the stage chat; no script
#   creates     files the activity starts (their templates must exist)
#   after       activities in the same phase this one follows (ordering only)
#   optional    default true — these never gate a phase; required documents live in the registry
#   requires    what must hold before it is offered: {profile: dotted.key} | {activity: id} | {file: path}
#   done_when   how it is known to be finished: {exists: path} | {exists_all: [paths]}
#               | {json: {file, key, equals}} — absent means it is never "done", only available
#
# Status is computed by activities_model.py: done, else blocked (with the reason), else available.

"0":

  - id: review
    label: "Review this stage's documents"
    command: sprd-review
    kind: draft
    creates: [.sdlc/artifacts/00-discovery/review-report.md]
    done_when: {exists: .sdlc/artifacts/00-discovery/review-report.md}

  - id: enhance
    label: "Write plain-language summaries for stakeholders"
    command: sprd-enhance
    kind: draft

  - id: phase-report
    label: "Export this stage's report"
    command: sprd-phase-report
    kind: run

  - id: coach
    label: "Talk it through"
    command: sprd-coach
    kind: talk

